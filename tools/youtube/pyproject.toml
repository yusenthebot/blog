[project]
name = "yt-upload"
version = "0.1.0"
description = "Upload the blog's episode films to YouTube and write the video ids back into the posts."
requires-python = ">=3.12"
dependencies = [
  "google-api-python-client>=2.150",
  "google-auth-oauthlib>=1.2",
  "pysocks>=1.7.1",
  "pyyaml>=6.0",
]

[project.scripts]
yt-upload = "yt_upload.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yt_upload"]

[tool.ruff]
line-length = 110
